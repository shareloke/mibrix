# mixel 统一版本目录（Version Catalog）
# ============================================================
# 版本规则：
#   1. Spring Boot BOM 统一管理的依赖（starters / groovy / caffeine /
#      h2 / mysql / postgresql / jackson 等）不写版本号，由 BOM 裁决。
#   2. Kotlin 相关与插件版本显式固定，避免与 BOM 管理的 Kotlin 版本漂移。
# ============================================================

[versions]
kotlin = "2.0.21"
spring-boot = "3.5.16"
spring-dependency-management = "1.1.7"
detekt = "1.23.8"
spotless = "7.2.1"
swagger = "2.9.1"
swagger-annotations = "2.2.50"

[libraries]

# detekt 插件相关
detekt-plugin-formatting = { module = "io.gitlab.arturbosch.detekt:detekt-formatting", version.ref = "detekt" }

# ---- Kotlin ----
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }

# ---- Jackson ----
jackson-module-kotlin = { module = "com.fasterxml.jackson.module:jackson-module-kotlin" }
jackson-dataformat-yaml = { module = "com.fasterxml.jackson.dataformat:jackson-dataformat-yaml" }

# ---- Spring Framework（由 BOM 管理版本） ----
spring-core = { module = "org.springframework:spring-core" }
spring-context = { module = "org.springframework:spring-context" }
spring-web = { module = "org.springframework:spring-web" }
spring-webmvc = { module = "org.springframework:spring-webmvc" }

# ---- 日志 / 校验 / Servlet（由 BOM 管理版本） ----
slf4j-api = { module = "org.slf4j:slf4j-api" }
jakarta-validation-api = { module = "jakarta.validation:jakarta.validation-api" }
jakarta-servlet-api = { module = "jakarta.servlet:jakarta.servlet-api" }
jakarta-annotation-api = { module = "jakarta.annotation:jakarta.annotation-api" }

# ---- Spring Boot Starters（由 BOM 管理版本） ----
spring-boot-dependencies = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
spring-boot-starter = { module = "org.springframework.boot:spring-boot-starter" }
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-jdbc = { module = "org.springframework.boot:spring-boot-starter-jdbc" }
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-data-redis = { module = "org.springframework.boot:spring-boot-starter-data-redis" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-boot-autoconfigure-processor = { module = "org.springframework.boot:spring-boot-autoconfigure-processor" }

# springdoc 接口文档
springdoc-bom = { module = "org.springdoc:springdoc-openapi-bom", version.ref = "swagger" }
springdoc-common = { module = "org.springdoc:springdoc-openapi-starter-common" }
springdoc-webmvc-scalar = { module = "org.springdoc:springdoc-openapi-starter-webmvc-scalar"}

# ---- Groovy（JSR-223 脚本引擎，版本由 BOM 管理） ----
groovy = { module = "org.apache.groovy:groovy" }
groovy-jsr223 = { module = "org.apache.groovy:groovy-jsr223" }

# ---- 缓存（版本由 BOM 管理） ----
caffeine = { module = "com.github.ben-manes.caffeine:caffeine" }

# ---- 数据库驱动（版本由 BOM 管理） ----
h2 = { module = "com.h2database:h2" }
mysql-connector = { module = "com.mysql:mysql-connector-j" }
postgresql = { module = "org.postgresql:postgresql" }

# ---- 测试 ----
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
kotlin-jpa = { id = "org.jetbrains.kotlin.plugin.jpa", version.ref = "kotlin" }
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }
